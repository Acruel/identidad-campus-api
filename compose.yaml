services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus_dev
      POSTGRES_DB: identidad_campus
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - campus_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d identidad_campus"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  campus_data:
